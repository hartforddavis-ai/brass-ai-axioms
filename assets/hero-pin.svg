<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" fill="none">
  <!-- Engineering elevation. A shear pin drives a joint between two parts.
       Overload shears it SQUARE at the joint face; the sheared half runs free.
       Plain machined dowel, flat ends, clean fracture. Thin ash strokes, no fill. -->

  <!-- the joint: the plane the pin drives across and shears on -->
  <line x1="450" y1="146" x2="450" y2="258" stroke="#5b6673" stroke-width="1.5"/>

  <!-- dimension line, top: the pin as made -->
  <g stroke="#5b6673" stroke-width="1" opacity="0.55">
    <line x1="150" y1="150" x2="150" y2="126"/>
    <line x1="748" y1="150" x2="748" y2="126"/>
    <line x1="150" y1="132" x2="748" y2="132"/>
  </g>

  <!-- ghost: the driving half on its original axis, before shear -->
  <rect x="448" y="167" width="300" height="56"
        stroke="#5b6673" stroke-width="1" stroke-dasharray="5 6" opacity="0.7"/>

  <!-- left half: still seated, still on the axis -->
  <rect x="150" y="167" width="300" height="56" stroke="#c7ccd1" stroke-width="1.9"/>
  <line x1="165" y1="167" x2="165" y2="223" stroke="#c7ccd1" stroke-width="1.3"/>

  <!-- right half: sheared square at the joint, dropped off the axis -->
  <rect x="450" y="201" width="298" height="56" stroke="#c7ccd1" stroke-width="1.9"/>
  <line x1="733" y1="201" x2="733" y2="257" stroke="#c7ccd1" stroke-width="1.3"/>

  <!-- centreline, broken at the joint -->
  <g stroke="#5b6673" stroke-width="1" stroke-dasharray="16 9">
    <line x1="108" y1="195" x2="450" y2="195"/>
    <line x1="450" y1="229" x2="804" y2="229"/>
  </g>

  <text x="450" y="285" font-family="IBM Plex Mono, ui-monospace, monospace"
        font-size="14" letter-spacing="4" fill="#8b9096" text-anchor="middle">SHEAR PLANE</text>
</svg>
